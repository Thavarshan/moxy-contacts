name: Feature request
description: Suggest an improvement to Moxy Contacts.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals focused on the archive. Do not include real contact records or private data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need and when it comes up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you have considered.
