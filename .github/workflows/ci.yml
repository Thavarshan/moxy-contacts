name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_deploy:
        description: Deploy this checked main commit to production
        type: choice
        options: [skip, deploy]
        default: skip
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          npm ci
      - name: Check built frontend assets
        run: npm run check
      - name: Verify formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Unit and Cloudflare runtime tests
        run: uv run pytest
      - name: Validate Python package build
        run: uv build

  deploy-production:
    name: deploy production
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.production_deploy == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and build assets
        run: |
          uv sync --locked --all-groups
          npm ci
          npm run build
      - name: Check deployment secrets and origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          ACCESS_OWNER_EMAIL: ${{ vars.ACCESS_OWNER_EMAIL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          test -n "$PRODUCTION_WORKER_URL" || { echo "PRODUCTION_WORKER_URL is required"; exit 1; }
          test -n "$ACCESS_OWNER_EMAIL" || { echo "ACCESS_OWNER_EMAIL is required"; exit 1; }
          test -n "$SESSION_SECRET" || { echo "SESSION_SECRET is required"; exit 1; }
      - name: Verify the actual Cloudflare Access policy before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_OWNER_EMAIL: ${{ vars.ACCESS_OWNER_EMAIL }}
        run: uv run python scripts/verify_access.py
      - name: Verify the current production Worker is already private
        env:
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
        run: uv run python scripts/smoke_access.py
      - name: Confirm this is still the latest main commit
        id: freshness
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test -n "$latest_sha" || { echo "Could not read the main branch tip"; exit 1; }
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists; skipping this deployment."
          fi
      - name: Apply D1 schema
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler d1 migrations apply DB --remote --env production
      - name: Prepare temporary Worker secrets file
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          WORKER_SECRETS_FILE: ${{ runner.temp }}/moxy-worker-secrets.json
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: uv run python scripts/write_worker_secrets.py "$WORKER_SECRETS_FILE"
      - name: Deploy the checked main commit
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRETS_FILE: ${{ runner.temp }}/moxy-worker-secrets.json
        run: uv run pywrangler deploy --env production --secrets-file "$WORKER_SECRETS_FILE"
      - name: Verify unauthenticated requests are blocked by Cloudflare Access
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
        run: uv run python scripts/smoke_access.py
      - name: Remove temporary Worker secrets file
        if: always()
        env:
          WORKER_SECRETS_FILE: ${{ runner.temp }}/moxy-worker-secrets.json
        run: python scripts/write_worker_secrets.py --remove "$WORKER_SECRETS_FILE"
